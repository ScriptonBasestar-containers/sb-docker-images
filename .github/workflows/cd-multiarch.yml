# Manual native multi-arch build for postgres-exts.
#
# cd.yml is the tag-triggered release workflow and uses QEMU emulation for the
# arm64 leg of the buildx multi-arch build. This workflow is the opt-in native
# path: it builds amd64 and arm64 on separate runners (the arm64 one requires a
# runner labelled `ubuntu-latest-arm64` — a self-hosted runner or a custom label
# on GitHub's hosted ARM64 fleet) and merges the manifests. Native builds are
# 5–10x faster than QEMU but need that runner provisioned, so this workflow is
# dispatch-only to avoid racing cd.yml on every release tag.

name: CD - Multi-Arch Native Build (postgres-exts, manual)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Bundle to build'
        required: true
        type: choice
        options:
          - essential
          - full
          - both
      pg_version:
        description: 'PostgreSQL major version'
        required: false
        default: '18'
        type: choice
        options:
          - '15'
          - '16'
          - '17'
          - '18'
      version_tag:
        description: 'Immutable version suffix (e.g. 1.2.3); blank = manual-YYYYMMDD'
        required: false
        default: ''

jobs:
  build-postgres-amd64:
    name: Build PostgreSQL (AMD64)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant: [essential, full]
      fail-fast: false

    steps:
      - name: Skip non-selected variant
        id: gate
        env:
          SELECTED: ${{ github.event.inputs.variant }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$SELECTED" = "both" ] || [ "$SELECTED" = "$VARIANT" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Variant $VARIANT not selected (selected: $SELECTED) — skipping."
          fi

      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build AMD64 Image
        if: steps.gate.outputs.run == 'true'
        env:
          PG: ${{ github.event.inputs.pg_version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          cd images/database/postgres-exts
          # Override the bundle's canonical push tag with an arch-suffixed one so the
          # later imagetools merge can combine amd64 + arm64 into one manifest.
          TAGVAR="$(echo "$VARIANT" | tr a-z A-Z)_TAG"
          make "${VARIANT}-buildx" \
            PG_VERSION="$PG" \
            PLATFORMS=linux/amd64 \
            "${TAGVAR}=scriptonbasestar/postgres-exts:${PG}-${VARIANT}-amd64"

      - name: Save image digest
        if: steps.gate.outputs.run == 'true'
        env:
          PG: ${{ github.event.inputs.pg_version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          docker buildx imagetools inspect "scriptonbasestar/postgres-exts:${PG}-${VARIANT}-amd64" --raw > "/tmp/digest-${VARIANT}-amd64.txt"

      - name: Upload digest
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-amd64
          path: /tmp/digest-${{ matrix.variant }}-amd64.txt
          retention-days: 1

  build-postgres-arm64:
    name: Build PostgreSQL (ARM64)
    runs-on: ubuntu-latest-arm64  # self-hosted / custom-labelled ARM64 runner

    strategy:
      matrix:
        variant: [essential, full]
      fail-fast: false

    steps:
      - name: Skip non-selected variant
        id: gate
        env:
          SELECTED: ${{ github.event.inputs.variant }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$SELECTED" = "both" ] || [ "$SELECTED" = "$VARIANT" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
            echo "Variant $VARIANT not selected (selected: $SELECTED) — skipping."
          fi

      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build ARM64 Image
        if: steps.gate.outputs.run == 'true'
        env:
          PG: ${{ github.event.inputs.pg_version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          cd images/database/postgres-exts
          TAGVAR="$(echo "$VARIANT" | tr a-z A-Z)_TAG"
          make "${VARIANT}-buildx" \
            PG_VERSION="$PG" \
            PLATFORMS=linux/arm64 \
            "${TAGVAR}=scriptonbasestar/postgres-exts:${PG}-${VARIANT}-arm64"

      - name: Save image digest
        if: steps.gate.outputs.run == 'true'
        env:
          PG: ${{ github.event.inputs.pg_version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          docker buildx imagetools inspect "scriptonbasestar/postgres-exts:${PG}-${VARIANT}-arm64" --raw > "/tmp/digest-${VARIANT}-arm64.txt"

      - name: Upload digest
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-arm64
          path: /tmp/digest-${{ matrix.variant }}-arm64.txt
          retention-days: 1

  merge-postgres-manifests:
    name: Merge PostgreSQL Manifests
    runs-on: ubuntu-latest
    needs: [build-postgres-amd64, build-postgres-arm64]

    strategy:
      matrix:
        variant: [essential, full]

    steps:
      - name: Skip non-selected variant
        id: gate
        env:
          SELECTED: ${{ github.event.inputs.variant }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$SELECTED" = "both" ] || [ "$SELECTED" = "$VARIANT" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Download AMD64 digest
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-amd64
          path: /tmp

      - name: Download ARM64 digest
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-arm64
          path: /tmp

      - name: Log in to Docker Hub
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve version suffix
        if: steps.gate.outputs.run == 'true'
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_tag }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=manual-$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

      - name: Create and push manifest
        if: steps.gate.outputs.run == 'true'
        env:
          PG: ${{ github.event.inputs.pg_version }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "scriptonbasestar/postgres-exts:${PG}-${VARIANT}" \
            -t "scriptonbasestar/postgres-exts:${PG}-${VARIANT}-${VERSION}" \
            "scriptonbasestar/postgres-exts:${PG}-${VARIANT}-amd64" \
            "scriptonbasestar/postgres-exts:${PG}-${VARIANT}-arm64"

      - name: Verify manifest
        if: steps.gate.outputs.run == 'true'
        env:
          PG: ${{ github.event.inputs.pg_version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          docker buildx imagetools inspect "scriptonbasestar/postgres-exts:${PG}-${VARIANT}"

      - name: Create Release Summary
        if: steps.gate.outputs.run == 'true'
        env:
          PG: ${{ github.event.inputs.pg_version }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## PostgreSQL Extensions Multi-Arch Release"
            echo ""
            echo "**PG**: $PG"
            echo "**Variant**: $VARIANT"
            echo "**Version**: $VERSION"
            echo "**Platforms**: linux/amd64 (native), linux/arm64 (native)"
            echo ""
            echo "**Performance**: 5-10x faster than QEMU emulation"
            echo ""
            echo "Verify at: https://hub.docker.com/r/scriptonbasestar/postgres-exts/tags"
          } >> "$GITHUB_STEP_SUMMARY"
