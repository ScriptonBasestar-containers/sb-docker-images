services:
  # MariaDB - MySQL-compatible relational database
  # https://hub.docker.com/_/mariadb
  mariadb:
    image: mariadb:${MARIADB_TAG:-11-noble}
    container_name: ${MARIADB_CONTAINER_NAME:-mariadb}
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-app}
      MARIADB_USER: ${MYSQL_USER:-app}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-apppass}
      TZ: ${TZ:-UTC}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - db-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  db-network:
    driver: bridge

volumes:
  mariadb-data:
